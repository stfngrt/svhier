[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svhier"
version = "0.1.0"
description = "SystemVerilog hierarchy explorer"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Stefan Engert" }]
requires-python = ">=3.11"
dependencies = [
    "pyslang>=12",
    "ruamel.yaml",
    "networkx",
    "rich>=14.3.3",
]

[project.scripts]
svhier = "svhier.cli:main"

[project.entry-points."svhier.frontends"]
slang = "svhier.slang_frontend:SlangFrontend"

[project.optional-dependencies]
dev = [
    "mypy>=1.20.0",
    "pytest",
    "pytest-cov",
    "pytest-mypy",
    "types-networkx>=3.6.1.20261031",
]
docs = [
    "sphinx",
    "myst-parser",
    "furo",
    "sphinx-argparse",
    "sphinx-design",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/svhier"]

[tool.mypy]
python_version = "3.11"
mypy_path = "plugins/svhier-ghdl/src"

[tool.pylint.main]
# pyslang is a compiled extension; let pylint load it to see its members.
# pyslang.ast / pyslang.syntax / pyslang.parsing / pyslang.driver are registered in sys.modules at import time and
# have no file on disk, so pylint cannot resolve them statically.
extension-pkg-allow-list = ["pyslang"]
ignored-modules = ["pyslang.ast", "pyslang.syntax", "pyslang.parsing", "pyslang.driver"]

[tool.pylint.typecheck]
# pyslang exposes its API via a compiled extension; suppress false no-member errors
generated-members = ["pyslang.*"]

[tool.pylint.format]
max-line-length = 160

[tool.pylint."messages control"]
disable = ["logging-fstring-interpolation"]

[dependency-groups]
dev = [
    "pylint>=4.0.5",
    "pytest-pylint>=0.21.0",
]
